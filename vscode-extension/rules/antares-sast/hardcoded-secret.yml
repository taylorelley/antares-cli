rules:
  - id: antares-798-python
    message: "Hardcoded secret detected. Store secrets in environment variables or a secrets manager."
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    patterns:
      - pattern-either:
          - pattern: |
              password = "..."
          - pattern: |
              secret = "..."
          - pattern: |
              api_key = "..."
          - pattern: |
              token = "..."
          - pattern: |
              SECRET_KEY = "..."
      # Note: broad pattern - use metavariable-regex to reduce noise in production
      - metavariable-regex:
          metavariable: $PATTERN_VALUE
          regex: .{8,}

  - id: antares-798-javascript
    message: "Hardcoded secret detected. Store secrets in environment variables or a secrets manager."
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    patterns:
      - pattern-either:
          - pattern: |
              const password = "..."
          - pattern: |
              const secret = "..."
          - pattern: |
              const apiKey = "..."
          - pattern: |
              const token = "..."
          - pattern: |
              const SECRET_KEY = "..."

  - id: antares-798-java
    message: "Hardcoded secret detected. Store secrets in environment variables or a secrets manager."
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security
    patterns:
      - pattern-either:
          - pattern: |
              String password = "..."
          - pattern: |
              String secret = "..."
          - pattern: |
              String apiKey = "..."
          - pattern: |
              String token = "..."
          - pattern: |
              String SECRET_KEY = "..."
